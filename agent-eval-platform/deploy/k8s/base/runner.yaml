apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
spec:
  replicas: 2   # 生产：KEDA 按队列深度扩缩（书 46.5），见 overlays/prod
  selector: { matchLabels: { app: runner } }
  template:
    metadata:
      labels: { app: runner }
    spec:
      containers:
        - name: runner
          image: eval-runner:dev
          env:
            - name: EVAL_SERVER_URL
              value: http://server:8080
            - name: RUNNER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      # 生产沙箱形态（书 46.4/47）：runner 在专用节点组以 gVisor RuntimeClass
      # 运行任务 pod，并配 NetworkPolicy 默认断网。演示版 mock agent 无需沙箱。
