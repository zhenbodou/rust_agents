apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eval-platform
resources:
  - ../../base
  - networkpolicy.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target: { kind: Deployment, name: server }
