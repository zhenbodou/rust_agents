# 三栈 CI（书 48.4 模板的实例化）。放仓库根的 .github/workflows/ 下生效，
# 路径按 monorepo 实际位置调整（此处假设平台在 agent-eval-platform/ 子目录）。
name: eval-platform-ci
on:
  pull_request:
    paths: ["agent-eval-platform/**"]
  push:
    branches: [main]
    paths: ["agent-eval-platform/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agent-eval-platform

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: evalplatform }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/evalplatform
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "agent-eval-platform/server" }
      - run: cargo fmt --check
        working-directory: agent-eval-platform/server
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: agent-eval-platform/server
      - run: cargo test
        working-directory: agent-eval-platform/server

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: agent-eval-platform/runner
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: agent-eval-platform/runner
      - run: uv run pytest -q
        working-directory: agent-eval-platform/runner

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install
        working-directory: agent-eval-platform/web
      - run: pnpm tsc --noEmit
        working-directory: agent-eval-platform/web

  docker:
    if: github.ref == 'refs/heads/main'
    needs: [rust, python, web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agent-eval-platform/server
          push: true
          tags: ghcr.io/${{ github.repository }}/eval-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
